[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complaintgraph"
version = "0.1.0"
description = "Public-review complaint mining: a small transformer, theme clustering and evidence-backed product gap reports."
requires-python = ">=3.9"
dependencies = [
  "transformers>=4.40",
  "torch>=2.2",
  "datasets>=2.19",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy<2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
